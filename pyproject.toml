[project]
name = "quant-research-lab"
version = "0.1.0"
description = "Learning-first quantitative research laboratory built around notebooks, statistical validation, and Jesse."
requires-python = ">=3.12"
dependencies = [
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
